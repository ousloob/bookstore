apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bookstore-system

resources:
  - ../../base/migrate

# The image is built locally and loaded into kind, never pulled from a
# registry. Keep this in step with zarf/k8s/dev/kustomization.yaml: the job
# has to run the same build as the API it migrates for.
images:
  - name: bookstore/sales-api
    newName: localhost/bookstore/sales-api
    newTag: dev

patches:
  - target:
      kind: Job
      name: sales-migrate
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      - op: add
        path: /spec/template/spec/initContainers/0/imagePullPolicy
        value: IfNotPresent
