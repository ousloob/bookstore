apiVersion: v1
kind: Service
metadata:
  name: sales-service
spec:
  selector:
    app: sales
  ports:
    - name: sales-api
      port: 3000
      targetPort: sales-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sales
  template:
    metadata:
      labels:
        app: sales
    spec:
      # Match the sales user created in Containerfile.sales.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      # The deploy runs the migration job before applying this Deployment,
      # but that ordering lives outside the cluster. This makes the guarantee
      # hold inside it too: a pod never starts serving against a schema that
      # lacks a migration its binary carries, whoever applied the manifest.
      # It only reads the schema version; it never migrates. On an ordinary
      # restart the schema is already there and it passes on the first try.
      initContainers:
        - name: wait-for-migration
          image: bookstore/sales-api
          command: ["./admin", "wait", "migrations", "-timeout", "300s"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: database-credentials
          env:
            - name: DB_HOST
              value: database-service
            - name: DB_NAME
              value: bookdb
      containers:
        - name: sales-api
          image: bookstore/sales-api
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Injects DB_USER and DB_PASSWORD, named exactly as the config
          # struct in api/sales/main.go expects them.
          envFrom:
            - secretRef:
                name: database-credentials
          env:
            - name: DB_HOST
              value: database-service
            - name: DB_NAME
              value: bookdb
          ports:
            - name: sales-api
              containerPort: 3000
          livenessProbe:
            httpGet:
              path: /livez
              port: sales-api
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: sales-api
            periodSeconds: 5
            # The handler gives the database ping 2s. kubelet's default here
            # is 1s, so a ping that took between 1s and 2s counted as a
            # failure while the handler was still waiting for an answer it
            # would have accepted. Give kubelet more patience than the
            # handler, not less, or a slow database drops every pod out of
            # the Service at once.
            timeoutSeconds: 3
