name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep these in sync with the Makefile.
  STATICCHECK: honnef.co/go/tools/cmd/staticcheck@v0.8.2
  GOVULNCHECK: golang.org/x/vuln/cmd/govulncheck@v1.9.0

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: CGO_ENABLED=0 go vet ./...

      # Reports the modernizations `go fix` would apply, without applying
      # them. Exits non-zero when there is anything to fix.
      - name: Modernize
        run: go fix -diff ./...

      - name: Staticcheck
        run: go run "$STATICCHECK" -checks=all ./...

      - name: Govulncheck
        run: go run "$GOVULNCHECK" ./...

  test:
    name: Test
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Report coverage
        run: |
          go tool cover -html=coverage.out -o coverage.html
          {
            echo '### Coverage'
            echo '```'
            go tool cover -func=coverage.out | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.out
            coverage.html

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o bin/sales ./api/sales

      - name: Upload the binary
        uses: actions/upload-artifact@v7
        with:
          name: sales
          path: bin/sales
